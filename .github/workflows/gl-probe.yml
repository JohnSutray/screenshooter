name: gl-probe
on:
  push:
    branches: [next]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Load vgem
        run: |
          uname -r
          sudo modprobe vgem || { sudo apt-get update -qq && sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" && sudo modprobe vgem; }
          ls -l /dev/dri
      - name: KWin in a container with the render node
        run: |
          docker run --rm --privileged -v /dev/dri:/dev/dri archlinux:latest bash -c '
            pacman -Syu --noconfirm --needed kwin mesa dbus glib2 >/dev/null 2>&1
            mkdir -p /tmp/rt && chmod 700 /tmp/rt && export XDG_RUNTIME_DIR=/tmp/rt
            dbus-run-session -- kwin_wayland --virtual --no-lockscreen --exit-with-session "sh -c \"sleep 4; gdbus call --session --dest org.kde.KWin --object-path /Compositor --method org.freedesktop.DBus.Properties.Get org.kde.kwin.Compositing compositingType\"" 2>&1 | grep -iE "compositingType|gl2|qpainter|egl|drm|render|error" | head -20'
